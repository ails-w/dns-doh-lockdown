[Resolve]
# DNS con filtrado de malware + contenido adulto (Cloudflare for Families)
DNS=1.1.1.3#cloudflare-dns.com 1.0.0.3#cloudflare-dns.com
# Sin fallback: evita que se salte el filtro
FallbackDNS=
# El DNS global manda para todos los dominios
Domains=~.
# opportunistic: intenta cifrar (DoT) y, si la red bloquea 853, cae a DNS normal
# (que igual queda forzado a 1.1.1.3 por el firewall)
DNSOverTLS=opportunistic
DNSSEC=allow-downgrade
Cache=yes
