#!/usr/bin/nft -f
# Firewall endurecido + DNS forzado a Cloudflare for Families (1.1.1.3).
# Tablas propias (dnsguard_*) para NO pisar las tablas de libvirt/Docker.
# Doc: modules/02-firewall-nftables/README.md - docs/architecture.md

define DOH4 = { 1.1.1.1, 1.0.0.1, 8.8.8.8, 8.8.4.4,
                9.9.9.9, 149.112.112.112,
                94.140.14.14, 94.140.15.15,
                208.67.222.222, 208.67.220.220 }
define DOH6 = { 2606:4700:4700::1111, 2606:4700:4700::1001,
                2001:4860:4860::8888, 2001:4860:4860::8844,
                2620:fe::fe, 2620:fe::9 }
define CFF4 = { 1.1.1.3, 1.0.0.3 }
define BRIDGES = { "virbr*", "docker0", "br-*" }

# ===========================================================================
# FILTER (IPv4 + IPv6)
# ===========================================================================
destroy table inet dnsguard
table inet dnsguard {
  chain input {
    type filter hook input priority filter; policy drop
    ct state invalid drop
    ct state { established, related } accept
    iif lo accept
    meta l4proto { icmp, icmpv6 } accept
    iifname "virbr*" udp dport { 53, 67 } accept   # libvirt: dhcp/dns
    iifname { "docker0", "br-*" } accept            # docker: bridge -> host
  }

  chain forward {
    type filter hook forward priority filter; policy drop
    # DoT/DoH tambien para VMs/containers (su trafico pasa por forward)
    meta l4proto { tcp, udp } th dport 853 drop
    ip  daddr $DOH4 meta l4proto { tcp, udp } th dport 443 drop
    ip6 daddr $DOH6 meta l4proto { tcp, udp } th dport 443 drop
    ct state { established, related } accept
    iifname "virbr*" accept
    oifname "virbr*" accept
    iifname { "docker0", "br-*" } accept
    oifname { "docker0", "br-*" } accept
  }

  chain output {
    type filter hook output priority filter; policy accept
    ip daddr 127.0.0.53 udp dport 53 accept         # stub resolved
    ip daddr 127.0.0.53 tcp dport 53 accept
    ip daddr $CFF4 tcp dport 853 accept             # DoT solo a Families
    meta l4proto { tcp, udp } th dport 853 drop
    ip  daddr $DOH4 meta l4proto { tcp, udp } th dport 443 drop
    ip6 daddr $DOH6 meta l4proto { tcp, udp } th dport 443 drop
  }
}

# ===========================================================================
# NAT IPv4: forzar DNS (host + reenviado de VMs/containers) a Families
# ===========================================================================
destroy table ip dnsguard_nat
table ip dnsguard_nat {
  chain prerouting {
    type nat hook prerouting priority -100; policy accept
    iifname $BRIDGES meta l4proto { udp, tcp } th dport 53 dnat to 1.1.1.3
  }
  chain output {
    type nat hook output priority -100; policy accept
    ip daddr 127.0.0.0/8 return
    meta l4proto { udp, tcp } th dport 53 dnat to 1.1.1.3
  }
}

# ===========================================================================
# NAT IPv6 (preventivo; solo actua si hay conectividad v6)
# ===========================================================================
destroy table ip6 dnsguard_nat
table ip6 dnsguard_nat {
  chain output {
    type nat hook output priority -100; policy accept
    ip6 daddr ::1 return
    meta l4proto { udp, tcp } th dport 53 dnat to 2606:4700:4700::1113
  }
}
