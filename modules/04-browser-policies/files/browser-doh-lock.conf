# DoH off para todos los navegadores (fuente unica en /etc/browser-policies)
d /etc/browser-policies 0755 root root -

# --- Chromium family ---
d /etc/brave/policies 0755 root root -
d /etc/brave/policies/managed 0755 root root -
L+ /etc/brave/policies/managed/00-doh-off.json - - - - /etc/browser-policies/chromium-doh-off.json

d /etc/chromium/policies 0755 root root -
d /etc/chromium/policies/managed 0755 root root -
L+ /etc/chromium/policies/managed/00-doh-off.json - - - - /etc/browser-policies/chromium-doh-off.json

d /etc/opt/chrome/policies 0755 root root -
d /etc/opt/chrome/policies/managed 0755 root root -
L+ /etc/opt/chrome/policies/managed/00-doh-off.json - - - - /etc/browser-policies/chromium-doh-off.json

d /etc/opt/edge/policies 0755 root root -
d /etc/opt/edge/policies/managed 0755 root root -
L+ /etc/opt/edge/policies/managed/00-doh-off.json - - - - /etc/browser-policies/chromium-doh-off.json

d /etc/opt/vivaldi/policies 0755 root root -
d /etc/opt/vivaldi/policies/managed 0755 root root -
L+ /etc/opt/vivaldi/policies/managed/00-doh-off.json - - - - /etc/browser-policies/chromium-doh-off.json

# --- Firefox ---
d /etc/firefox/policies 0755 root root -
L+ /etc/firefox/policies/policies.json - - - - /etc/browser-policies/firefox-policies.json
